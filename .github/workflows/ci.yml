name: CI

on:
  push:
    paths: &changed-files
      - self_signed_ca/**
      - pyproject.toml
      - .github/workflows/ci.yml
  pull_request:
    paths: *changed-files

jobs:
  test:
    runs-on: ubuntu-latest
    container: 'evindunn/poetry:latest'
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - uses: evindunn/github-actions/poetry-cache@main

      - name: Install Dependencies
        run: poetry install --with=dev

      - name: Test
        run: poetry run pytest

    #   - name: E2E
    #     run: bash e2e.sh
