name: CI

on:
  push: &build-rules
    branches: [main]
    paths:
      - self_signed_ca/**
      - pyproject.toml
      - .github/workflows/ci.yml
  pull_request: *build-rules
  workflow_dispatch: {}

permissions:
  contents: read
  code-quality: write

jobs:
  test:
    runs-on: ubuntu-latest
    container: 'evindunn/poetry:latest'
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'poetry'

      - name: Install Dependencies
        run: poetry install --with=dev

      - name: Test
        run: poetry run pytest --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: python
          label: pytest

    #   - name: E2E
    #     run: bash e2e.sh
